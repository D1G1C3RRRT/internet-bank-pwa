# Nginx reverse proxy configuration for tapfast.tail8c034f.ts.net
# Place this file in: /etc/nginx/sites-available/tapfast.tail8c034f.ts.net on your VPS
# Then enable it by running: ln -s /etc/nginx/sites-available/tapfast.tail8c034f.ts.net /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name tapfast.tail8c034f.ts.net;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tapfast.tail8c034f.ts.net;

    # SSL Certificate paths (generate using certbot: certbot --nginx -d tapfast.tail8c034f.ts.net)
    ssl_certificate /etc/letsencrypt/live/tapfast.tail8c034f.ts.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tapfast.tail8c034f.ts.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://localhost:4444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

